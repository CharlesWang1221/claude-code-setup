<!doctype html>
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PodcastTC"; src: local("Microsoft JhengHei"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #01101A; }
      body { font-family: "PodcastTC", sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .background { position: absolute; inset: 0; background: #01101A; }
      .frame { position: absolute; left: 70px; top: 252px; width: 940px; height: 940px; overflow: hidden; border: 2px solid rgba(109,227,234,.56); transform-origin: 50% 45%; }
      .frame img { display: block; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05); }
      .beat { position: absolute; inset: 0; opacity: 0; }
      .eyebrow { position: absolute; top: 130px; left: 72px; color: #6DE3EA; font-family: "JetBrains Mono", monospace; font-size: 27px; letter-spacing: 3px; }
      .title { position: absolute; top: 1265px; left: 72px; width: 840px; color: #fff; font-size: 84px; font-weight: 700; line-height: 1.13; letter-spacing: -2px; }
      .sub { position: absolute; z-index: 2; top: 1485px; left: 76px; width: 800px; color: #FFFFFF; font-size: 35px; line-height: 1.42; }
      .rule { position: absolute; z-index: 1; left: 76px; top: 1597px; width: 134px; height: 9px; background: #4AB897; transform-origin: left center; }
      .progress { position: absolute; right: 72px; top: 130px; display: flex; gap: 10px; }
      .progress span { display: block; width: 52px; height: 8px; background: rgba(255,255,255,.22); transform-origin: left center; }
      .cta { position: absolute; left: 76px; bottom: 116px; color: #6DE3EA; font-size: 29px; letter-spacing: 2px; }
      .index { position: absolute; right: 72px; bottom: 111px; color: rgba(255,255,255,.7); font-family: "JetBrains Mono", monospace; font-size: 24px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <section id="visual" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div class="background"></div>
        <div id="cover-frame" class="frame"><img id="cover" src="assets/cover.png" alt="S3EP2 埃及展封面" /></div>
      </section>
      <section id="copy" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <div id="progress" class="progress" aria-hidden="true"><span id="bar-1"></span><span id="bar-2"></span><span id="bar-3"></span></div>
        <article id="beat-1" class="beat">
          <p class="eyebrow">01 / 一家人出發</p>
          <h1 class="title">全家一起去</h1>
          <p class="sub">不是旅行。是去台南看一場埃及展。</p>
          <div class="rule"></div>
        </article>
        <article id="beat-2" class="beat">
          <p class="eyebrow">02 / 展場入口</p>
          <h1 class="title">台南看<br />埃及展</h1>
          <p class="sub">從一件展品，聊到一個文明。</p>
          <div class="rule"></div>
        </article>
        <article id="beat-3" class="beat">
          <p class="eyebrow">03 / 故事開始</p>
          <h1 class="title">一場展覽<br />打開埃及</h1>
          <p class="sub">完整對話，在《不標準答案》。</p>
          <div class="rule"></div>
        </article>
        <p id="cta" class="cta">完整內容，在 Podcast</p>
        <p id="index" class="index">15 SEC / 09:16</p>
      </section>
      <audio id="hook-audio" src="assets/s3ep2-hook.mp3" data-start="0" data-duration="15" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set('#cover-frame', { scale: 1.04, x: 0, opacity: 1 }, 0)
        .set('#beat-1', { autoAlpha: 1, y: 0 }, 0)
        .set('#bar-1', { backgroundColor: '#6DE3EA', scaleX: 1 }, 0)
        .set('#cta, #index', { autoAlpha: 1 }, 0)
        .to('#cover-frame', { keyframes: [
          { scale: 1.05, x: 0, duration: 4.4, ease: 'power1.inOut' },
          { scale: 1.00, x: 0, duration: 4.8, ease: 'power1.inOut' },
          { scale: 1.04, x: 0, duration: 5.8, ease: 'power1.inOut' }
        ] }, 0)
        .to('#beat-1', { y: -70, autoAlpha: 0, duration: .3, ease: 'power2.in' }, 4.0)
        .fromTo('#beat-2', { y: 78, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .52, ease: 'power3.out', immediateRender: false }, 4.35)
        .to('#bar-1', { backgroundColor: 'rgba(255,255,255,.22)', duration: .2 }, 4.3)
        .to('#bar-2', { backgroundColor: '#6DE3EA', duration: .2 }, 4.3)
        .to('#beat-2', { y: -70, autoAlpha: 0, duration: .3, ease: 'power2.in' }, 8.9)
        .fromTo('#beat-3', { y: 78, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: .52, ease: 'power3.out', immediateRender: false }, 9.25)
        .to('#bar-2', { backgroundColor: 'rgba(255,255,255,.22)', duration: .2 }, 9.2)
        .to('#bar-3', { backgroundColor: '#6DE3EA', duration: .2 }, 9.2);
      window.__timelines['main'] = tl;
    </script>
  </body>
</html>
