<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;background:#0C1F35;
     font-family:'Microsoft JhengHei','微軟正黑體',sans-serif}
.wrap{width:1080px;height:1080px;display:flex;flex-direction:column;padding:80px}
.num{color:#E07A5F;font-size:110px;font-weight:700;line-height:1;opacity:0.9}
.pt{flex:1;display:flex;align-items:center;color:#fff;
     font-size:56px;font-weight:700;line-height:1.55}
.div{width:56px;height:4px;background:#3F72AF;border-radius:2px;margin:28px 0}
.foot{display:flex;justify-content:space-between;align-items:center}
.show{color:rgba(255,255,255,0.3);font-size:20px;letter-spacing:5px}
.pg{color:rgba(255,255,255,0.25);font-size:20px}
</style></head><body>
<div class="wrap">
  <div class="num">03</div>
  <div class="pt">傻不是弱點，是還有靈魂的證明</div>
  <div class="div"></div>
  <div class="foot">
    <div class="show">不 標 準 答 案</div>
    <div class="pg">4 / 5</div>
  </div>
</div>
</body></html>
